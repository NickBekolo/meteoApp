<div class="search-shell">
  <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="video/orbit-bg.mp4" type="video/mp4" />
  </video>
  <div class="overlay" aria-hidden="true"></div>

  <form class="search" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="city">Rechercher une ville</label>
    <div class="row">
      <input
        id="city"
        type="text"
        formControlName="city"
        placeholder="Paris"
        autocomplete="off"
        [class.invalid]="showError"
        [attr.aria-invalid]="showError"
        aria-describedby="city-error"
      />
      <button type="submit">Rechercher</button>
    </div>

    @if (showError) {
      <p id="city-error" class="error" role="alert">Veuillez saisir une ville.</p>
    }
  </form>
</div>
